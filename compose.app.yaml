# Complément local : docker compose -f compose.yaml -f compose.app.yaml ...
services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/app
      - auth_state:/var/lib/innovevents
    environment:
      APP_ENV: local
      APP_ORIGIN: http://127.0.0.1:5173
    secrets: [mysql_api, mongo_api, mongo_auth]
    depends_on:
      mysql: {condition: service_healthy}
      mongodb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/health') === '{\"status\":\"ready\"}' ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: "no"
  web:
    image: node:24-bookworm-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: ["npm", "run", "dev"]
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: {condition: service_healthy}
    restart: "no"
volumes:
  web_node_modules:
  auth_state:
secrets:
  mysql_api: {file: ./.secrets/mysql-api.txt}
  mongo_api: {file: ./.secrets/mongo-api.txt}
  mongo_auth: {file: ./.secrets/mongo-auth.txt}

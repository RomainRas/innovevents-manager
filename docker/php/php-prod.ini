; Réglages PHP de production
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
upload_max_filesize = 5M
post_max_size = 6M
memory_limit = 256M
max_execution_time = 30
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
date.timezone = UTC

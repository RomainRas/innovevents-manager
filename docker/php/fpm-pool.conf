; Pool PHP-FPM de l'API. Les variables d'environnement (APP_ENV, APP_ORIGIN, AGENCY_EMAIL)
; doivent rester visibles par getenv() : clear_env désactivé.
[www]
listen = 9000
clear_env = no
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no

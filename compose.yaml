# Environnement local de verification des bases, pas un deploiement de production.
name: innovevents-ecf-db
services:
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: innovevents_test
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
    secrets:
      - mysql_root
      - mysql_client
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/client.sh:/opt/innovevents/client.sh:ro
      - ./database/mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(sh /opt/innovevents/client.sh --batch --skip-column-names -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=\"innovevents_test\"')\" = 16"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: "no"
  mongodb:
    image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    environment:
      MONGO_INITDB_ROOT_USERNAME: ecf_admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root
      MONGO_INITDB_DATABASE: innovevents_test
    secrets:
      - mongo_root
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./database/mongodb/001_logs.js:/docker-entrypoint-initdb.d/001_logs.js:ro
      - ./docker/mongodb/healthcheck.js:/opt/innovevents/healthcheck.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--file", "/opt/innovevents/healthcheck.js"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s
    restart: "no"
# Aucun port publie sur Windows : acces par docker compose exec.
volumes:
  mysql_data:
  mongo_data:
  mongo_config:
secrets:
  mysql_root:
    file: ./.secrets/mysql-root.txt
  mysql_client:
    file: ./.secrets/mysql-client.cnf
  mongo_root:
    file: ./.secrets/mongo-root.txt

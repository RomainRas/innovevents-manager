<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="48" y="1021.82">Apr&#xe8;s succ&#xe8;s, le message appara&#xee;t sur la fiche &#xe9;v&#xe9;nement. Les autres &#xe9;tats restent dans la saisie ou son dialogue. Aucun fonctionnement hors connexion ni </tspan><tspan x="48" y="1045.82">conservation apr&#xe8;s fermeture n&#x2019;est promis. Illustrations statiques, sans sauvegarde r&#xe9;elle.</tspan></text>

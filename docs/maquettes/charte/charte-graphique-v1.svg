<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="80" y="1621.82">Espacements : 8, 16, 24, 32 et 48 px.&#10;</tspan><tspan x="80" y="1645.82">Rayon des cartes : 8 px.&#10;</tspan><tspan x="80" y="1669.82">Cibles tactiles : au moins 48 px de haut.&#10;</tspan><tspan x="80" y="1693.82">Conserver les libell&#xe9;s au-dessus des champs.&#10;</tspan><tspan x="80" y="1717.82">Une action principale mise en &#xe9;vidence par zone.</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="80" y="1765.82">Focus clavier : contour bleu nuit de 2 px, s&#xe9;par&#xe9; du contr&#xf4;le </tspan><tspan x="80" y="1789.82">par 2 px blancs. &#xc0; tester sur les fonds r&#xe9;els.</tspan></text>

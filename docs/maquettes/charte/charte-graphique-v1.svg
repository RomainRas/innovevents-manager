<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="644" y="1741.82">Mesures sur les paires indiqu&#xe9;es uniquement. La navigation </tspan><tspan x="644" y="1765.82">clavier, les &#xe9;tats, le zoom et les lecteurs d&#x2019;&#xe9;cran devront &#xea;tre </tspan><tspan x="644" y="1789.82">test&#xe9;s dans l&#x2019;application.</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="48" y="1891.09">Base de conception du projet ECF, sans reprise d&#x2019;une identit&#xe9; commerciale officielle. Les six maquettes et leur encha&#xee;nement restent &#xe0; r&#xe9;aliser. Source : &#xe9;nonc&#xe9; p. 4, 6 </tspan><tspan x="48" y="1911.09">et 16.</tspan></text>

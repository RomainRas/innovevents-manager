<svg width="520" height="1433" viewBox="0 0 520 1433" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="520" height="1433" fill="#F5F5F5"/>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="32" y="55.2273">&#xc9;v&#xe9;nements &#xe0; venir&#10;</tspan><tspan x="32" y="84.2273">Notes et &#xe9;tats</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="32" y="130.818">WF-MOB-01 &#xb7; Chlo&#xe9; et Jos&#xe9;&#10;</tspan><tspan x="32" y="152.818">Version 1 &#xb7; Annotations hors interface.</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="32" y="205.227">Source</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="32" y="251.818">&#xc9;nonc&#xe9; p. 14 : &#xe0; l&#x2019;ouverture, une liste claire des &#xe9;v&#xe9;nements </tspan><tspan x="32" y="273.818">&#xe0; venir ; s&#xe9;lection d&#x2019;un &#xe9;v&#xe9;nement pour consulter sa fiche. </tspan><tspan x="32" y="295.818">CGU et CGV &#xe0; fournir.</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="32" y="348.227">Contenu et navigation</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="32" y="394.818">Chaque carte donne acc&#xe8;s au d&#xe9;tail : nom, dates, lieu et </tspan><tspan x="32" y="416.818">client associ&#xe9;. Depuis le d&#xe9;tail, le client ouvrira la fiche </tspan><tspan x="32" y="438.818">contact ; le bouton Ajouter une note sera pr&#xe9;sent sur la </tspan><tspan x="32" y="460.818">fiche &#xe9;v&#xe9;nement. Ces deux &#xe9;crans sont les suivants &#xe0; </tspan><tspan x="32" y="482.818">dessiner.</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="32" y="535.227">Choix de conception</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="32" y="581.818">Affichage apr&#xe8;s connexion avec un pr&#xe9;nom dynamique ; </tspan><tspan x="32" y="603.818">m&#xea;me structure pour Chlo&#xe9; et Jos&#xe9;, selon les droits. Tri </tspan><tspan x="32" y="625.818">chronologique propos&#xe9;. Cartes lisibles, boutons de 48 px de </tspan><tspan x="32" y="647.818">haut et d&#xe9;filement vertical. Trois cartes illustratives : aucune </tspan><tspan x="32" y="669.818">limite &#xe0; trois &#xe9;v&#xe9;nements n&#x2019;est impos&#xe9;e pour le tableau de </tspan><tspan x="32" y="691.818">bord mobile.</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="32" y="744.227">Donn&#xe9;es et &#xe9;tats</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="32" y="790.818">Les crochets sont des rep&#xe8;res, pas des donn&#xe9;es r&#xe9;elles.&#10;</tspan><tspan x="32" y="812.818">Chargement : &#xab; Chargement des &#xe9;v&#xe9;nements&#x2026; &#xbb;&#10;</tspan><tspan x="32" y="834.818">Liste vide : &#xab; Aucun &#xe9;v&#xe9;nement &#xe0; venir. &#xbb;&#10;</tspan><tspan x="32" y="856.818">&#xc9;chec : &#xab; Impossible de charger les &#xe9;v&#xe9;nements. &#xbb; avec </tspan><tspan x="32" y="878.818">R&#xe9;essayer.&#10;</tspan><tspan x="32" y="900.818">Session expir&#xe9;e : retour &#xe0; la connexion.</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="32" y="953.227">Mobilit&#xe9;</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="32" y="999.818">Aucun fonctionnement hors connexion n&#x2019;est promis par le </tspan><tspan x="32" y="1021.82">sujet. Pr&#xe9;voir un message clair si le r&#xe9;seau est indisponible. </tspan><tspan x="32" y="1043.82">Les liens CGU et CGV sont repr&#xe9;sent&#xe9;s ; leur contenu et </tspan><tspan x="32" y="1065.82">leur page restent &#xe0; r&#xe9;aliser.</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="32" y="1118.23">V&#xe9;rifications futures</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="32" y="1164.82">Contr&#xf4;ler les droits c&#xf4;t&#xe9; serveur, l&#x2019;ordre des &#xe9;v&#xe9;nements et </tspan><tspan x="32" y="1186.82">l&#x2019;ouverture de la bonne fiche. Tester le d&#xe9;filement et la taille </tspan><tspan x="32" y="1208.82">des textes sur appareil. Le wireframe reste statique : aucun </tspan><tspan x="32" y="1230.82">test mobile r&#xe9;el n&#x2019;a &#xe9;t&#xe9; ex&#xe9;cut&#xe9;.</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="32" y="1283.23">Conservation</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="32" y="1329.82">Source modifiable dans Figma, export SVG et explication </tspan><tspan x="32" y="1351.82">sur dev. Ce panneau ne compte pas comme un &#xe9;cran </tspan><tspan x="32" y="1373.82">suppl&#xe9;mentaire. Charte graphique et maquette mobile &#xe0; </tspan><tspan x="32" y="1395.82">r&#xe9;aliser ensuite.</tspan></text>
</svg>

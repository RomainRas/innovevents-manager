<svg width="520" height="1464" viewBox="0 0 520 1464" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="520" height="1464" fill="#F5F5F5"/>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="32" y="55.2273">WF-WEB-01&#10;</tspan><tspan x="32" y="84.2273">Demande de devis</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="32" y="138.818">Notes de conception &#x2014; 18 octobre 2026&#10;</tspan><tspan x="32" y="160.818">Un seul &#xe9;cran ; les &#xe9;tats ci-dessous ne sont pas compt&#xe9;s </tspan><tspan x="32" y="182.818">comme des &#xe9;crans suppl&#xe9;mentaires.</tspan></text>
<rect x="32.5" y="220.5" width="455" height="210" fill="white"/>
<rect x="32.5" y="220.5" width="455" height="210" stroke="#D9D9D9"/>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="49" y="260.227">Contenu v&#xe9;rifi&#xe9;</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="49" y="298.818">&#xc9;nonc&#xe9; : pages 4, 6&#x2013;8.&#10;</tspan><tspan x="49" y="320.818">10 champs obligatoires, menu commun et mentions </tspan><tspan x="49" y="342.818">l&#xe9;gales.&#10;</tspan><tspan x="49" y="364.818">Type d&#x2019;&#xe9;v&#xe9;nement : saisie libre avec exemples.&#10;</tspan><tspan x="49" y="386.818">Inter et niveaux de gris sont provisoires pour le </tspan><tspan x="49" y="408.818">wireframe.</tspan></text>
<rect x="32.5" y="463.5" width="455" height="232" fill="white"/>
<rect x="32.5" y="463.5" width="455" height="232" stroke="#D9D9D9"/>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="49" y="503.227">Apr&#xe8;s enregistrement</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="49" y="541.818">Message propos&#xe9; dans l&#x2019;&#xe9;nonc&#xe9; :&#10;</tspan><tspan x="49" y="563.818">&#xab; Merci pour votre demande. Chlo&#xe9; vous recontactera </tspan><tspan x="49" y="585.818">dans les plus brefs d&#xe9;lais pour discuter de votre projet. </tspan><tspan x="49" y="607.818">&#xbb;&#10;</tspan><tspan x="49" y="629.818">&#10;</tspan><tspan x="49" y="651.818">Le message doit &#xea;tre modifiable. La r&#xe9;ussite est </tspan><tspan x="49" y="673.818">affich&#xe9;e apr&#xe8;s l&#x2019;enregistrement effectif.</tspan></text>
<rect x="32.5" y="728.5" width="455" height="210" fill="white"/>
<rect x="32.5" y="728.5" width="455" height="210" stroke="#D9D9D9"/>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="49" y="768.227">Erreurs de saisie &#x2014; proposition</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="49" y="806.818">Afficher un message pr&#xe8;s du champ concern&#xe9; :&#10;</tspan><tspan x="49" y="828.818">&#xab; Renseignez le nom de votre entreprise. &#xbb;&#10;</tspan><tspan x="49" y="850.818">&#xab; Saisissez une adresse e-mail valide. &#xbb;&#10;</tspan><tspan x="49" y="872.818">&#10;</tspan><tspan x="49" y="894.818">Conserver les autres valeurs et orienter le focus vers la </tspan><tspan x="49" y="916.818">premi&#xe8;re erreur.</tspan></text>
<rect x="32.5" y="971.5" width="455" height="261" fill="white"/>
<rect x="32.5" y="971.5" width="455" height="261" stroke="#D9D9D9"/>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="49" y="1011.23">&#xc9;chec d&#x2019;enregistrement &#x2014; </tspan><tspan x="49" y="1040.23">proposition</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="49" y="1078.82">&#xab; Votre demande n&#x2019;a pas pu &#xea;tre enregistr&#xe9;e. </tspan><tspan x="49" y="1100.82">R&#xe9;essayez. &#xbb;&#10;</tspan><tspan x="49" y="1122.82">&#10;</tspan><tspan x="49" y="1144.82">Conserver la saisie. Emp&#xea;cher les envois r&#xe9;p&#xe9;t&#xe9;s </tspan><tspan x="49" y="1166.82">pendant le traitement. L&#x2019;&#xe9;chec du seul courriel &#xe0; </tspan><tspan x="49" y="1188.82">l&#x2019;agence ne doit pas annuler une demande d&#xe9;j&#xe0; </tspan><tspan x="49" y="1210.82">enregistr&#xe9;e.</tspan></text>
<rect x="32.5" y="1265.5" width="455" height="166" fill="white"/>
<rect x="32.5" y="1265.5" width="455" height="166" stroke="#D9D9D9"/>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.02em"><tspan x="49" y="1305.23">&#xc0; v&#xe9;rifier lors du d&#xe9;veloppement</tspan></text>
<text fill="#1E1E1E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="49" y="1343.82">Validation c&#xf4;t&#xe9; serveur, navigation clavier, libell&#xe9;s </tspan><tspan x="49" y="1365.82">associ&#xe9;s aux champs et annonce accessible des </tspan><tspan x="49" y="1387.82">erreurs et de la confirmation. Le wireframe ne prouve </tspan><tspan x="49" y="1409.82">pas ces comportements.</tspan></text>
</svg>

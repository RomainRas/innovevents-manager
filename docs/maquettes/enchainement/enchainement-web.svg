<text fill="#216E4E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="1137" y="647.727">Devis accept&#xe9;</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="1137" y="680.818">Notification &#xe0; Innov&#x2019;Events. Chlo&#xe9; poursuit </tspan><tspan x="1137" y="704.818">l&#x2019;organisation ; le client retrouve le suivi dans son </tspan><tspan x="1137" y="728.818">espace.</tspan></text>

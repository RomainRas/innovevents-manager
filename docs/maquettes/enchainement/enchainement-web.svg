<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="606" y="648.727">Consultation du devis</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="606" y="681.818">Consulter sa proposition en &#xab; &#xe9;tude c&#xf4;t&#xe9; client &#xbb;. </tspan><tspan x="606" y="705.818">Choisir : accepter, modifier avec motif, ou refuser.</tspan></text>

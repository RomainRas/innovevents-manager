<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="73" y="647.727">Acc&#xe9;der &#xe0; son espace</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="73" y="680.818">Se connecter puis ouvrir le devis affect&#xe9; au </tspan><tspan x="73" y="704.818">compte. Compte absent : cr&#xe9;ation et envoi des </tspan><tspan x="73" y="728.818">acc&#xe8;s pr&#xe9;vus.</tspan></text>

<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="605" y="290.091">CHLO&#xc9; &#xb7; &#xc9;TAPE DE GESTION</tspan></text>
<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="605" y="327.727">Qualifier le besoin</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="605" y="360.818">Contacter le prospect. Si possible : convertir en </tspan><tspan x="605" y="384.818">client. Sinon : &#xe9;tat &#xab; &#xe9;chou&#xe9; &#xbb;, courriel et arr&#xea;t du </tspan><tspan x="605" y="408.818">parcours.</tspan></text>

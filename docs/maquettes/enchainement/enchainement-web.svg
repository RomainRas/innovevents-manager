<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="1137" y="940.091">CLIENT &#xb7; R&#xc9;SULTAT</tspan></text>
<text fill="#B42318" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="1137" y="977.727">Devis refus&#xe9;</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="1137" y="1010.82">Fin de cette proposition. Conserver l&#x2019;historique ; ne </tspan><tspan x="1137" y="1034.82">pas lancer automatiquement l&#x2019;&#xe9;v&#xe9;nement.</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="492" y="341.091">Transmettre</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="1028" y="341.091">Convertir</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="350" y="493.091">PDF transmis + acc&#xe8;s au compte &#x2014; passage &#xe0; une autre personne, pas une redirection de Chlo&#xe9; vers le compte client</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="493" y="661.091">Connexion</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="1030" y="661.091">Accepter</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="818" y="843.091">Modifier</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="1140" y="835.091">Refuser</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="510" y="991.091">Motif</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="440" y="1173.09">Contre-proposition : retour &#xe0; la pr&#xe9;paration, puis nouvelle d&#xe9;cision du client</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="48" y="1267.82">P&#xe9;rim&#xe8;tre : parcours des trois maquettes web, avec les &#xe9;tapes indispensables autour. Les autres pages de l&#x2019;application restent &#xe0; concevoir et d&#xe9;velopper. Diagramme statique ; r&#xe8;gles d&#xe9;taill&#xe9;es </tspan><tspan x="48" y="1291.82">et cas d&#x2019;&#xe9;chec dans la documentation.</tspan></text>

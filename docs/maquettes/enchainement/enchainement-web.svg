<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="73" y="977.727">Pr&#xe9;parer une r&#xe9;ponse</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="73" y="1010.82">Lire le motif, reprendre WEB02 puis transmettre la </tspan><tspan x="73" y="1034.82">contre-proposition. Le client retrouve WEB03.</tspan></text>

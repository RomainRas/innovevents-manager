<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="48" y="117.818">Les fl&#xe8;ches distinguent navigation et transmissions m&#xe9;tier. Chaque acteur utilise sa propre session.</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="48" y="167.091">Contour turquoise : &#xe9;cran maquett&#xe9;  &#x2022;  Contour gris : &#xe9;tape, &#xe9;tat ou &#xe9;cran compl&#xe9;mentaire &#xe0; concevoir  &#x2022;  Pointill&#xe9;s : reprise du parcours</tspan></text>

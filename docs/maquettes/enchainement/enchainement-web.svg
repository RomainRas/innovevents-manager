<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="1138" y="328.727">Pr&#xe9;paration du devis</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="1138" y="361.818">Compl&#xe9;ter &#xe9;v&#xe9;nement et prestations ; g&#xe9;n&#xe9;rer le </tspan><tspan x="1138" y="385.818">PDF. Transmettre par envoi manuel confirm&#xe9; ou </tspan><tspan x="1138" y="409.818">automatique.</tspan></text>

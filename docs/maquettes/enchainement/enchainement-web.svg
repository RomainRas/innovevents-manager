<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="74" y="328.727">Demande de devis</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="74" y="361.818">Envoyer les 10 champs obligatoires.&#10;</tspan><tspan x="74" y="385.818">Apr&#xe8;s succ&#xe8;s : remerciement affich&#xe9; et prospect &#xab; </tspan><tspan x="74" y="409.818">&#xe0; contacter &#xbb;.</tspan></text>

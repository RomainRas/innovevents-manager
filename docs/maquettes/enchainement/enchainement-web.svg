<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="605" y="940.091">CLIENT &#xb7; &#xc9;TAT &#xc0; CONCEVOIR</tspan></text>
<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="605" y="977.727">Demander une modification</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="605" y="1010.82">Saisir un motif obligatoire. Apr&#xe8;s validation : devis </tspan><tspan x="605" y="1034.82">en &#xab; modification &#xbb;, &#xe0; traiter par Chlo&#xe9;.</tspan></text>

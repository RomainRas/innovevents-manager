<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="1137" y="690.091">APPLICATIONS EXTERNES</tspan></text>
<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="1137" y="727.727">T&#xe9;l&#xe9;phone &#xb7; Courriel &#xb7; Plan</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="1137" y="760.818">Num&#xe9;ro &#x2192; t&#xe9;l&#xe9;phone&#10;</tspan><tspan x="1137" y="784.818">E-mail &#x2192; messagerie par d&#xe9;faut&#10;</tspan><tspan x="1137" y="808.818">Adresse du client &#x2192; itin&#xe9;raire&#10;</tspan><tspan x="1137" y="832.818">Aucun appel ou envoi automatique.</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="510" y="341.091">Choisir</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="1025" y="341.091">Nom client</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="893" y="575.091">Ajouter une note</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="48" y="550.091">Retour apr&#xe8;s succ&#xe8;s ou annulation</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="1418" y="555.091">Toucher une </tspan><tspan x="1418" y="575.091">coordonn&#xe9;e</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="1112" y="955.091">Retour depuis l&#x2019;application externe</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="48" y="1037.82">Acc&#xe8;s transversaux : conditions g&#xe9;n&#xe9;rales d&#x2019;utilisation et de vente depuis les trois fiches principales. Si la session expire, r&#xe9;authentification avant d&#x2019;acc&#xe9;der aux donn&#xe9;es internes ; comportement </tspan><tspan x="48" y="1061.82">&#xe0; d&#xe9;velopper et tester.</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="48" y="1147.82">Le trajet utilise l&#x2019;adresse postale du client, pas le lieu de l&#x2019;&#xe9;v&#xe9;nement. Sch&#xe9;ma statique : t&#xe9;l&#xe9;phone, messagerie, cartographie et sauvegarde de note ne sont pas ex&#xe9;cut&#xe9;s. Les six maquettes </tspan><tspan x="48" y="1171.82">principales ne couvrent pas toutes les pages de l&#x2019;application.</tspan></text>

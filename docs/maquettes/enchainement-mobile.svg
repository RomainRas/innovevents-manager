<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="74" y="328.727">&#xc9;v&#xe9;nements &#xe0; venir</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="74" y="361.818">&#xc0; l&#x2019;ouverture : liste des &#xe9;v&#xe9;nements &#xe0; venir. </tspan><tspan x="74" y="385.818">S&#xe9;lectionner un &#xe9;v&#xe9;nement pour consulter ses </tspan><tspan x="74" y="409.818">informations.</tspan></text>

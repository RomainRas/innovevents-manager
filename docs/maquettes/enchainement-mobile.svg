<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="606" y="328.727">Fiche &#xe9;v&#xe9;nement</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="606" y="361.818">Nom, dates, lieu et client associ&#xe9;. Retour possible &#xe0; </tspan><tspan x="606" y="385.818">la liste. Action &#xab; Ajouter une note &#xbb; bien visible.</tspan></text>

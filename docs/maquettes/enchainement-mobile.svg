<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="36" font-weight="bold" letter-spacing="0em"><tspan x="48" y="75.0909">MOBILE &#x2014; Consulter, contacter, noter</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="48" y="117.818">Chlo&#xe9; et Jos&#xe9; &#xb7; Session interne autoris&#xe9;e requise, selon le mod&#xe8;le de droits retenu. Aucun acc&#xe8;s client &#xe0; ce parcours.</tspan></text>
<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="48" y="167.091">Contour turquoise : &#xe9;cran maquett&#xe9;  &#x2022;  Contour gris : &#xe9;tat, application externe ou r&#xe8;gle &#xe0; pr&#xe9;voir  &#x2022;  Les retours sont explicit&#xe9;s</tspan></text>

<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="605" y="690.091">MOB02-N &#xb7; &#xc9;TAT COMPL&#xc9;MENTAIRE MAQUETT&#xc9;</tspan></text>
<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="605" y="727.727">Ajouter une note</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="605" y="760.818">Saisir puis enregistrer. Apr&#xe8;s succ&#xe8;s : retour &#xe0; </tspan><tspan x="605" y="784.818">MOB02 et confirmation. Annuler : retour sans </tspan><tspan x="605" y="808.818">enregistrer ; confirmer l&#x2019;abandon si un texte est </tspan><tspan x="605" y="832.818">saisi.</tspan></text>

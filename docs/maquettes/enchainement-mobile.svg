<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="1138" y="328.727">Fiche client</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="1138" y="361.818">Entreprise, contact et coordonn&#xe9;es. Retour </tspan><tspan x="1138" y="385.818">possible &#xe0; l&#x2019;&#xe9;v&#xe9;nement d&#x2019;origine.</tspan></text>

<text fill="#526574" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="73" y="690.091">R&#xc8;GLES &#xb7; VARIANTES &#xc0; COMPL&#xc9;TER</tspan></text>
<text fill="#142D43" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="73" y="727.727">En cas d&#x2019;&#xe9;chec</tspan></text>
<text fill="#172B3A" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="73" y="760.818">Note vide : demander une saisie. &#xc9;chec de </tspan><tspan x="73" y="784.818">sauvegarde : conserver le texte. Coordonn&#xe9;e </tspan><tspan x="73" y="808.818">absente : aucun lien actif.</tspan></text>
